name: UE CI

on:
  workflow_dispatch:
    inputs:
      run_trusted_ue_validation:
        description: Run UE validation on the protected self-hosted runner
        required: true
        default: false
        type: boolean
      ue_version:
        description: Engine version for this trusted run (UE 5.3 is compatibility-only; releases require UE 5.8)
        required: true
        default: "5.8"
        type: choice
        options:
          - "5.8"
          - "5.3"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ue-ci.yml"
      - ".gitattributes"
      - "Config/**"
      - "Python/**"
      - "Source/**"
      - "Web/**"
      - "frontend/**"
      - "scripts/**"
      - "LICENSE"
      - "UnrealEditorWebUI.uplugin"

permissions:
  contents: read

concurrency:
  group: ue-ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.ue_version || '5.8' }}-${{ github.event_name }}-${{ inputs.run_trusted_ue_validation || 'hosted-only' }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Frontend and Python checks (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Node.js version
        run: node scripts/validate-node-version.mjs

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test Python command registry
        run: python -m unittest discover -s tests -v

      - name: Test release artifact verifier
        run: |
          node --test tests/download-verified-github-artifact.test.mjs
          node --test tests/resolve-ue-release-candidate.test.mjs

  ue-config-validation:
    name: UE config validation (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate plugin descriptor and module wiring
        shell: python
        run: |
          import json
          import pathlib

          root = pathlib.Path.cwd()
          descriptor = json.loads((root / "UnrealEditorWebUI.uplugin").read_text(encoding="utf-8-sig"))
          modules = {module.get("Name"): module for module in descriptor.get("Modules", [])}
          plugins = {plugin.get("Name"): plugin for plugin in descriptor.get("Plugins", [])}

          assert modules.get("UnrealEditorWebUI", {}).get("Type") == "Editor", "UnrealEditorWebUI module must be Editor type"
          assert plugins.get("PythonScriptPlugin", {}).get("Enabled") is True, "PythonScriptPlugin must be enabled"
          assert plugins.get("WebBrowserWidget", {}).get("Enabled") is True, "WebBrowserWidget must be enabled"
          assert (root / "Source/UnrealEditorWebUI/UnrealEditorWebUI.Build.cs").is_file(), "Build.cs missing"
          assert (root / "Source/UnrealEditorWebUI/Private/UnrealEditorWebUIBridge.cpp").is_file(), "Bridge source missing"
          assert (root / "Source/UnrealEditorWebUI/Private/Tests/UnrealEditorWebUIBrowserTests.cpp").is_file(), "GUI CEF automation test missing"
          assert (root / "Python/unreal_editor_webui_bridge_entry.py").is_file(), "Python bridge entry missing"
          assert (root / "Python/unreal_editor_webui_registry.py").is_file(), "Python registry missing"

      - name: Validate packaging scripts
        shell: bash
        run: |
          bash -n scripts/package-plugin.sh

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $Scripts = @(
            "scripts/package-plugin.ps1",
            "scripts/create-host-project.ps1",
            "scripts/setup-ue-runner.ps1"
          )
          foreach ($Script in $Scripts) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $Script).Path, [ref]$Tokens, [ref]$Errors) | Out-Null
            if ($Errors.Count -gt 0) {
              $Errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

  buildplugin-and-automation:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.ue_version == '5.3' && 'UE 5.3 BuildPlugin and automation (compatibility only)' || 'UE 5.8 BuildPlugin and automation' }}
    needs: [fast-checks, ue-config-validation]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_trusted_ue_validation)
    runs-on: [self-hosted, windows, gui, "${{ github.event_name == 'workflow_dispatch' && inputs.ue_version == '5.3' && 'ue-5.3' || 'ue-5.8' }}"]
    timeout-minutes: 90
    environment:
      name: ue-self-hosted
    env:
      UE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.ue_version == '5.3' && '5.3' || '5.8' }}
      UE_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.ue_version == '5.3' && 'C:\Program Files\Epic Games\UE_5.3' || 'C:\Program Files\Epic Games\UE_5.8' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate runner prerequisites
        shell: powershell
        run: |
          $RunUAT = Join-Path $env:UE_ROOT "Engine/Build/BatchFiles/RunUAT.bat"
          $EditorCmd = Join-Path $env:UE_ROOT "Engine/Binaries/Win64/UnrealEditor-Cmd.exe"
          $Editor = Join-Path $env:UE_ROOT "Engine/Binaries/Win64/UnrealEditor.exe"
          $BuildVersionPath = Join-Path $env:UE_ROOT "Engine/Build/Build.version"
          if (-not (Test-Path -LiteralPath $RunUAT -PathType Leaf)) { throw "RunUAT not found: $RunUAT" }
          if (-not (Test-Path -LiteralPath $EditorCmd -PathType Leaf)) { throw "UnrealEditor-Cmd not found: $EditorCmd" }
          if (-not (Test-Path -LiteralPath $Editor -PathType Leaf)) { throw "UnrealEditor not found: $Editor" }
          if (-not (Test-Path -LiteralPath $BuildVersionPath -PathType Leaf)) { throw "Build.version not found: $BuildVersionPath" }
          $BuildVersion = Get-Content -LiteralPath $BuildVersionPath -Raw | ConvertFrom-Json
          $DetectedVersion = "$($BuildVersion.MajorVersion).$($BuildVersion.MinorVersion)"
          if ($DetectedVersion -ne $env:UE_VERSION) { throw "Runner engine is UE $DetectedVersion, expected UE $env:UE_VERSION." }
          $RunnerSessionId = (Get-Process -Id $PID).SessionId
          if ($RunnerSessionId -eq 0) {
            throw "GUI validation cannot run from Windows Session 0. Start run.cmd interactively from the logged-in desktop session."
          }
          $SessionExplorer = @(Get-Process -Name explorer -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $RunnerSessionId })
          if ($SessionExplorer.Count -eq 0) {
            throw "No interactive Windows desktop was found in runner session $RunnerSessionId. Start the GUI runner from a logged-in desktop session."
          }
          Write-Host "Validated interactive GUI runner session $RunnerSessionId."
          node scripts/validate-node-version.mjs
          if ($LASTEXITCODE -ne 0) { throw "Unsupported Node.js version on self-hosted runner." }
          npm --version

      - name: Build packaged plugin
        shell: powershell
        run: |
          $RunUAT = Join-Path $env:UE_ROOT "Engine/Build/BatchFiles/RunUAT.bat"
          $PackageDir = Join-Path $env:RUNNER_TEMP "UnrealEditorWebUI-Package"
          $CommittedLicenseOutput = @(& git rev-parse "$($env:GITHUB_SHA):LICENSE")
          $CommittedLicenseExitCode = $LASTEXITCODE
          if ($CommittedLicenseExitCode -ne 0 -or $CommittedLicenseOutput.Count -ne 1) {
            throw "Could not resolve the committed LICENSE blob for $($env:GITHUB_SHA)."
          }
          $CommittedLicenseObject = $CommittedLicenseOutput[0].Trim()
          $WorkingLicenseOutput = @(& git hash-object --no-filters LICENSE)
          $WorkingLicenseExitCode = $LASTEXITCODE
          if ($WorkingLicenseExitCode -ne 0 -or $WorkingLicenseOutput.Count -ne 1) {
            throw "Could not hash the working-tree LICENSE bytes."
          }
          $WorkingLicenseObject = $WorkingLicenseOutput[0].Trim()
          if ($WorkingLicenseObject -ne $CommittedLicenseObject) {
            throw "Working-tree LICENSE bytes differ from the exact commit; check .gitattributes and checkout conversion."
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-plugin.ps1 $RunUAT $PackageDir
          if (-not (Test-Path -LiteralPath (Join-Path $PackageDir "UnrealEditorWebUI.uplugin") -PathType Leaf)) {
            throw "Packaged plugin descriptor missing."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $PackageDir "Web/dist/index.html") -PathType Leaf)) {
            throw "Packaged React frontend entry point missing."
          }
          $PackagedLicense = Join-Path $PackageDir "LICENSE"
          if (-not (Test-Path -LiteralPath $PackagedLicense -PathType Leaf)) {
            throw "Packaged plugin license missing."
          }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $PackagedLicense).Hash -ne (Get-FileHash -Algorithm SHA256 -LiteralPath "LICENSE").Hash) {
            throw "Packaged plugin license does not match the repository license."
          }

      - name: Create temporary host project
        shell: powershell
        run: |
          $ProjectDirName = "UnrealEditorWebUI-HostProject-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $ProjectDir = Join-Path $env:RUNNER_TEMP $ProjectDirName
          $PluginPackageDir = Join-Path $env:RUNNER_TEMP "UnrealEditorWebUI-Package"
          $ProjectOutput = @(powershell -NoProfile -ExecutionPolicy Bypass -File scripts/create-host-project.ps1 $ProjectDir $PluginPackageDir $env:UE_VERSION)
          if ($LASTEXITCODE -ne 0) { throw "Host project creation failed with exit code $LASTEXITCODE." }
          if ($ProjectOutput.Count -ne 1) { throw "Host project creation returned $($ProjectOutput.Count) output lines; expected exactly one project path." }
          $ProjectPath = $ProjectOutput[0]
          if (-not (Test-Path -LiteralPath $ProjectPath -PathType Leaf)) { throw "Host project was not created: $ProjectPath" }
          "HOST_PROJECT=$ProjectPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run UE automation tests
        shell: powershell
        run: |
          $EditorCmd = Join-Path $env:UE_ROOT "Engine/Binaries/Win64/UnrealEditor-Cmd.exe"
          $RunSuffix = "$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $LogPath = Join-Path $env:RUNNER_TEMP "UnrealEditorWebUI-Automation-$RunSuffix.log"
          & $EditorCmd $env:HOST_PROJECT -ExecCmds="Automation RunTests StartsWith:UnrealEditorWebUI.Bridge+StartsWith:UnrealEditorWebUI.Settings; Quit" -unattended -nopause -nosplash -NullRHI -abslog="$LogPath"
          if ($LASTEXITCODE -ne 0) {
            throw "Unreal automation tests failed with exit code $LASTEXITCODE. See $LogPath"
          }
          $LogText = Get-Content -LiteralPath $LogPath -Raw
          $RequiredTests = @(
            "UnrealEditorWebUI.Bridge.CancelTaskTransitions",
            "UnrealEditorWebUI.Bridge.CooperativeTaskRequiresPythonJob",
            "UnrealEditorWebUI.Bridge.DocumentSessionIsolation",
            "UnrealEditorWebUI.Bridge.ListTasksSummary",
            "UnrealEditorWebUI.Bridge.PackagedRegistryPing",
            "UnrealEditorWebUI.Bridge.PreflightValidation",
            "UnrealEditorWebUI.Bridge.ResourceLimitsAndProjectContext",
            "UnrealEditorWebUI.Bridge.TimeoutAndRemovalRules",
            "UnrealEditorWebUI.Settings.URLAllowlist"
          )
          foreach ($TestPath in $RequiredTests) {
            $Pattern = "Test Completed\. Result=\{Success\}.*Path=\{$([regex]::Escape($TestPath))\}"
            if (-not [regex]::IsMatch($LogText, $Pattern)) {
              throw "Required Unreal automation test did not report success: $TestPath"
            }
          }

      - name: Run packaged bridge smoke
        shell: powershell
        run: |
          $EditorCmd = Join-Path $env:UE_ROOT "Engine/Binaries/Win64/UnrealEditor-Cmd.exe"
          $RunSuffix = "$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $LogPath = Join-Path $env:RUNNER_TEMP "UnrealEditorWebUI-PackagedBridgeSmoke-$RunSuffix.log"
          $ResultPath = Join-Path $env:RUNNER_TEMP "UnrealEditorWebUI-PackagedBridgeSmoke-$RunSuffix.json"
          if (Test-Path -LiteralPath $ResultPath) {
            throw "Packaged bridge smoke result path is not fresh: $ResultPath"
          }
          $SmokeExitCode = -1
          $env:UNREAL_WEBUI_PACKAGED_SMOKE_RESULT = $ResultPath
          try {
            & $EditorCmd $env:HOST_PROJECT -run=pythonscript "-script=$PWD/scripts/validate-packaged-bridge-smoke.py" -unattended -nopause -nosplash -NullRHI -abslog="$LogPath"
            $SmokeExitCode = $LASTEXITCODE
          }
          finally {
            Remove-Item Env:\UNREAL_WEBUI_PACKAGED_SMOKE_RESULT -ErrorAction SilentlyContinue
          }
          if ($SmokeExitCode -ne 0) {
            throw "Packaged bridge smoke failed with exit code $SmokeExitCode. See $LogPath"
          }
          if (-not (Test-Path -LiteralPath $ResultPath -PathType Leaf)) {
            throw "Packaged bridge smoke did not write its structured result: $ResultPath"
          }
          $SmokeResult = Get-Content -LiteralPath $ResultPath -Raw | ConvertFrom-Json
          if ($SmokeResult.schemaVersion -ne 1 -or
              $SmokeResult.ok -ne $true -or
              $SmokeResult.scope.packagedFrontendAssets -ne $true -or
              @($SmokeResult.validatedAssets).Count -lt 1) {
            throw "Packaged bridge smoke result is incomplete or did not report success."
          }
          $LogText = Get-Content -LiteralPath $LogPath -Raw
          if ($LogText -notmatch "Unreal Editor WebUI packaged frontend smoke passed\.") {
            throw "Packaged bridge smoke success marker is missing from $LogPath"
          }

      - name: Run native settings smoke
        shell: powershell
        run: |
          $EditorCmd = Join-Path $env:UE_ROOT "Engine/Binaries/Win64/UnrealEditor-Cmd.exe"
          $RunSuffix = "$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $LogPath = Join-Path $env:RUNNER_TEMP "UnrealEditorWebUI-SettingsSmoke-$RunSuffix.log"
          & $EditorCmd $env:HOST_PROJECT -run=pythonscript "-script=$PWD/scripts/validate-settings-smoke.py" -unattended -nopause -nosplash -NullRHI -abslog="$LogPath"
          if ($LASTEXITCODE -ne 0) {
            throw "Native settings smoke failed with exit code $LASTEXITCODE. See $LogPath"
          }
          $LogText = Get-Content -LiteralPath $LogPath -Raw
          if ($LogText -notmatch "Unreal Editor WebUI settings smoke passed\.") {
            throw "Native settings smoke success marker is missing from $LogPath"
          }

      - name: Run GUI CEF binding and task event test
        shell: powershell
        run: |
          $Editor = Join-Path $env:UE_ROOT "Engine/Binaries/Win64/UnrealEditor.exe"
          $RunSuffix = "$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $LogPath = Join-Path $env:RUNNER_TEMP "UnrealEditorWebUI-BrowserAutomation-$RunSuffix.log"
          $ReportPath = Join-Path $env:RUNNER_TEMP "UnrealEditorWebUI-BrowserAutomationReport-$RunSuffix"
          # Windows PowerShell does not otherwise wait reliably for a GUI-subsystem executable.
          & $Editor $env:HOST_PROJECT -ExecCmds="Automation RunTests UnrealEditorWebUI.Browser.CEFBindingAndTaskEvent; Quit" -unattended -nopause -nosplash -ReportExportPath="$ReportPath" -abslog="$LogPath" | Out-Host
          $EditorExitCode = $LASTEXITCODE
          if ($EditorExitCode -ne 0) {
            throw "GUI CEF automation failed with exit code $EditorExitCode. See $LogPath"
          }
          $LogText = Get-Content -LiteralPath $LogPath -Raw
          $TestPath = "UnrealEditorWebUI.Browser.CEFBindingAndTaskEvent"
          $Pattern = "Test Completed\. Result=\{Success\}.*Path=\{$([regex]::Escape($TestPath))\}"
          if (-not [regex]::IsMatch($LogText, $Pattern)) {
            throw "Required GUI CEF automation test did not report success: $TestPath"
          }

      - name: Collect AutomationTool logs
        shell: powershell
        if: always()
        run: |
          $Source = Join-Path $env:APPDATA "Unreal Engine/AutomationTool/Logs"
          $Destination = Join-Path $env:RUNNER_TEMP "UnrealEditorWebUI-AutomationToolLogs"
          if (Test-Path -LiteralPath $Source -PathType Container) {
            New-Item -ItemType Directory -Path $Destination -Force | Out-Null
            Copy-Item -LiteralPath $Source -Destination $Destination -Recurse -Force
          }

      - name: Upload UE logs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: unreal-editor-webui-ue-logs
          path: |
            ${{ runner.temp }}/UnrealEditorWebUI-*.log
            ${{ runner.temp }}/UnrealEditorWebUI-*.json
            ${{ runner.temp }}/UnrealEditorWebUI-BrowserAutomationReport-*/**
            ${{ runner.temp }}/UnrealEditorWebUI-HostProject-*/Saved/Logs/**
            ${{ runner.temp }}/UnrealEditorWebUI-AutomationToolLogs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload packaged plugin
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: success()
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.ue_version == '5.3' && 'UnrealEditorWebUI-Package-UE53' || 'UnrealEditorWebUI-Package-UE58' }}
          path: ${{ runner.temp }}/UnrealEditorWebUI-Package
          if-no-files-found: error
          retention-days: 14
