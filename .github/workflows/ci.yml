name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.2", "24.18.1"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Validate Node.js version
        run: node scripts/validate-node-version.mjs

      - name: Validate repository tooling dependency sources
        run: node scripts/validate-npm-lock-registry.mjs package-lock.json

      - name: Install repository tooling dependencies
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Test immutable GitHub Action references
        run: |
          node --test tests/validate-github-action-references.test.mjs
          node scripts/validate-github-action-references.mjs

      - name: Test npm registry entrypoint guards
        run: |
          node --test tests/npm-registry-entrypoints.test.mjs
          node --test tests/package-plugin-registry-guard.test.mjs

      - name: Validate frontend dependency sources
        run: node scripts/validate-npm-lock-registry.mjs frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify packaged frontend entry point
        run: test -f Web/dist/index.html

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        if: matrix.node-version == '22.22.2'
        working-directory: frontend
        run: npm test

      - name: Test frontend with coverage
        if: matrix.node-version == '24.18.1'
        working-directory: frontend
        run: npm run test:coverage

  python:
    name: Python registry (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate plugin descriptor JSON
        run: python -m json.tool UnrealEditorWebUI.uplugin

      - name: Check Python syntax
        run: >-
          python -m compileall -q
          Python
          tests
          scripts/validate-packaged-bridge-smoke.py
          scripts/validate-settings-smoke.py

      - name: Run Python registry tests
        run: python -m unittest discover -s tests

  packaging-windows:
    name: Packaging contracts (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Validate Node.js version
        run: node scripts/validate-node-version.mjs

      - name: Test Windows packaging contracts
        shell: powershell
        run: |
          node --test tests/package-plugin-registry-guard.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/create-host-project.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/create-tool-pack.test.mjs

      - name: Test Windows UE build-environment contracts
        shell: powershell
        run: node --test tests/ue-build-environment.test.mjs

  repository:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false

      - name: Validate Node.js version
        run: node scripts/validate-node-version.mjs

      - name: Validate repository tooling dependency sources
        run: node scripts/validate-npm-lock-registry.mjs package-lock.json

      - name: Install repository tooling dependencies
        run: npm ci --ignore-scripts --include=dev --no-audit --no-fund

      - name: Test plugin version metadata contracts
        run: |
          node --test tests/validate-plugin-version.test.mjs
          node scripts/validate-plugin-version.mjs

      - name: Validate plugin descriptor and module wiring
        shell: python
        run: |
          import json
          import pathlib

          root = pathlib.Path.cwd()
          descriptor = json.loads((root / "UnrealEditorWebUI.uplugin").read_text(encoding="utf-8-sig"))
          modules = {module.get("Name"): module for module in descriptor.get("Modules", [])}
          plugins = {plugin.get("Name"): plugin for plugin in descriptor.get("Plugins", [])}

          assert modules.get("UnrealEditorWebUI", {}).get("Type") == "Editor", "UnrealEditorWebUI module must be Editor type"
          assert plugins.get("PythonScriptPlugin", {}).get("Enabled") is True, "PythonScriptPlugin must be enabled"
          assert plugins.get("WebBrowserWidget", {}).get("Enabled") is True, "WebBrowserWidget must be enabled"
          assert (root / "Source/UnrealEditorWebUI/UnrealEditorWebUI.Build.cs").is_file(), "Build.cs missing"
          assert (root / "Source/UnrealEditorWebUI/Private/UnrealEditorWebUIBridge.cpp").is_file(), "Bridge source missing"
          assert (root / "Source/UnrealEditorWebUI/Private/Tests/UnrealEditorWebUIBrowserTests.cpp").is_file(), "GUI CEF automation test missing"
          assert (root / "Python/unreal_editor_webui_bridge_entry.py").is_file(), "Python bridge entry missing"
          assert (root / "Python/unreal_editor_webui_registry.py").is_file(), "Python registry missing"
          assert (root / "scripts/validate-packaged-bridge-smoke.py").is_file(), "Packaged bridge smoke missing"
          license_text = (root / "LICENSE").read_text(encoding="utf-8")
          assert license_text.startswith("MIT License\n"), "MIT license header missing"
          assert "Copyright (c) 2026 zhuoxyang" in license_text, "MIT copyright holder missing"
          packaging_filter = (root / "Config/FilterPlugin.ini").read_text(encoding="utf-8")
          assert "/LICENSE" in {line.strip() for line in packaging_filter.splitlines()}, "LICENSE packaging rule missing"

      - name: Check Unix packaging script syntax
        run: bash -n scripts/package-plugin.sh

      - name: Enforce release file byte policy
        shell: bash
        run: |
          license_eol="$(git check-attr eol -- LICENSE)"
          if [[ "$license_eol" != "LICENSE: eol: lf" ]]; then
            echo "LICENSE must be pinned to LF in .gitattributes; received: $license_eol" >&2
            exit 1
          fi

      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          $Scripts = @(
            "scripts/package-plugin.ps1",
            "scripts/create-host-project.ps1",
            "scripts/create-tool-pack.ps1",
            "scripts/setup-ue-runner.ps1",
            "scripts/validate-git-cache-tools.ps1"
          )
          foreach ($Script in $Scripts) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $Script).Path, [ref]$Tokens, [ref]$Errors) | Out-Null
            if ($Errors.Count -gt 0) {
              $Errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Check release helper syntax
        run: |
          node --check scripts/resolve-ue-release-artifact.mjs
          node --check scripts/stage-plugin-from-commit.mjs
          node --check scripts/ue-build-environment.mjs
          node --check scripts/export-npm-dependencies.mjs
          node --check scripts/validate-github-action-references.mjs
          node --check scripts/validate-npm-lock-registry.mjs
          node --test tests/download-verified-github-artifact.test.mjs
          node --test tests/resolve-ue-release-candidate.test.mjs
          node --test tests/ue-build-environment.test.mjs
          node --test tests/validate-github-action-references.test.mjs
          node --test tests/validate-node-version.test.mjs
          node --test tests/validate-npm-lock-registry.test.mjs
          node --test tests/npm-registry-entrypoints.test.mjs
          node --test tests/package-plugin-registry-guard.test.mjs
          node --test tests/create-tool-pack.test.mjs
          node --test tests/ue-log-artifact-contract.test.mjs
          node --test tests/ue-path-filter-contract.test.mjs
          node scripts/validate-npm-lock-registry.mjs package-lock.json
          node scripts/validate-npm-lock-registry.mjs frontend/package-lock.json

      - name: Check tracked-file whitespace
        shell: bash
        run: |
          empty_tree="$(git hash-object -t tree /dev/null)"
          git -c core.whitespace=-blank-at-eof diff --check "$empty_tree" HEAD

      - name: Require immutable GitHub Action references
        run: node scripts/validate-github-action-references.mjs
