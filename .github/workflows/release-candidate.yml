name: Release Candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Candidate version tag (must match UnrealEditorWebUI.uplugin VersionName)
        required: true
        type: string
      ue_workflow_run_id:
        description: Successful trusted UE CI run id for the selected commit
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    name: Assemble verified UE 5.8 release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Validate Node.js version
        run: node scripts/validate-node-version.mjs

      - name: Resolve and validate release context
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
          MANUAL_UE_RUN_ID: ${{ inputs.ue_workflow_run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_commit="$(git rev-parse HEAD)"
          if [[ "$EVENT_NAME" == "push" ]]; then
            release_tag="$REF_NAME"
            requested_run_id=""
            tag_commit="$(git rev-list -n 1 "refs/tags/$release_tag")"
            if [[ "$tag_commit" != "$release_commit" ]]; then
              echo "Tag $release_tag resolves to $tag_commit, not checked-out commit $release_commit." >&2
              exit 1
            fi
          else
            release_tag="$MANUAL_RELEASE_TAG"
            requested_run_id="$MANUAL_UE_RUN_ID"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$release_tag' is not a supported semantic version tag." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && ! "$requested_run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Manual release candidates require a numeric trusted UE workflow run id." >&2
            exit 1
          fi

          node scripts/validate-plugin-version.mjs --tag "$release_tag"

          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "requested_run_id=$requested_run_id" >> "$GITHUB_OUTPUT"

      - name: Resolve, download, and verify exact trusted UE artifacts
        id: ue
        shell: bash
        env:
          ARTIFACT_ARCHIVE: trusted-package.zip
          BUILD_ENVIRONMENT_ARCHIVE: trusted-build-environment.zip
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          REQUESTED_RUN_ID: ${{ steps.release.outputs.requested_run_id }}
        run: |
          set -euo pipefail
          arguments=(
            --repository "$GITHUB_REPOSITORY"
            --commit "$RELEASE_COMMIT"
            --download-to "$ARTIFACT_ARCHIVE"
            --build-environment-download-to "$BUILD_ENVIRONMENT_ARCHIVE"
          )
          if [[ -n "$REQUESTED_RUN_ID" ]]; then
            arguments+=(--run-id "$REQUESTED_RUN_ID")
          fi
          node scripts/resolve-ue-release-artifact.mjs "${arguments[@]}"

      - name: Extract and verify trusted UE build environment
        shell: bash
        env:
          BUILD_ENVIRONMENT_ARCHIVE: trusted-build-environment.zip
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          UE_ARTIFACT_DIGEST: ${{ steps.ue.outputs.ue_artifact_digest }}
          UE_ARTIFACT_ID: ${{ steps.ue.outputs.ue_artifact_id }}
          UE_ARTIFACT_NAME: ${{ steps.ue.outputs.ue_artifact_name }}
          UE_RUN_ATTEMPT: ${{ steps.ue.outputs.ue_run_attempt }}
          UE_RUN_ID: ${{ steps.ue.outputs.ue_run_id }}
        run: |
          set -euo pipefail
          python scripts/extract-verified-artifact.py \
            --archive "$BUILD_ENVIRONMENT_ARCHIVE" \
            --destination trusted-build-environment \
            --profile build-environment
          mkdir -p release/metadata

          node scripts/ue-build-environment.mjs verify \
            --input trusted-build-environment/BuildEnvironment.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$RELEASE_COMMIT" \
            --run-id "$UE_RUN_ID" \
            --run-attempt "$UE_RUN_ATTEMPT" \
            --job-key buildplugin-and-automation \
            --package-artifact-id "$UE_ARTIFACT_ID" \
            --package-artifact-name "$UE_ARTIFACT_NAME" \
            --package-artifact-digest "$UE_ARTIFACT_DIGEST" \
            --canonical-output release/metadata/build-environment.json
          test -s release/metadata/build-environment.json

      - name: Extract verified trusted UE package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/extract-verified-artifact.py \
            --archive trusted-package.zip \
            --destination trusted-package \
            --profile package

      - name: Validate packaged plugin structure
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          if find trusted-package -type l -print -quit | grep -q .; then
            echo "The trusted package contains a symbolic link; refusing to assemble a release candidate." >&2
            exit 1
          fi
          test -f trusted-package/UnrealEditorWebUI.uplugin
          test -f trusted-package/Web/dist/index.html
          test -f trusted-package/LICENSE
          test -f trusted-package/SourceManifest.json
          manifest_commit="$(node -e "const fs=require('node:fs'); const value=JSON.parse(fs.readFileSync('trusted-package/SourceManifest.json','utf8')); if (value.schemaVersion !== 1 || !Array.isArray(value.files) || !value.files.some((file) => file.path === 'Web/dist/index.html' && file.source === 'generated')) process.exit(1); process.stdout.write(value.sourceCommit ?? '')")"
          if [[ "$manifest_commit" != "$RELEASE_COMMIT" ]]; then
            echo "The package source manifest is not bound to exact release commit '$RELEASE_COMMIT'." >&2
            exit 1
          fi
          if ! cmp -s LICENSE trusted-package/LICENSE; then
            echo "The packaged license does not match the exact release commit." >&2
            exit 1
          fi

          node scripts/validate-plugin-version.mjs \
            --tag "$RELEASE_TAG" \
            --compare-descriptor trusted-package/UnrealEditorWebUI.uplugin

      - name: Validate frontend dependency sources
        run: node scripts/validate-npm-lock-registry.mjs frontend/package-lock.json

      - name: Generate SBOM and locked dependency inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/metadata
          npm sbom \
            --prefix frontend \
            --package-lock-only \
            --sbom-format cyclonedx \
            --sbom-type application \
            > release/metadata/npm-cyclonedx.json
          node scripts/export-npm-dependencies.mjs \
            frontend/package-lock.json \
            release/metadata/npm-dependencies.json

      - name: Write fail-closed provenance
        shell: python
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          UE_BUILD_ENVIRONMENT_ARTIFACT_DIGEST: ${{ steps.ue.outputs.ue_build_environment_artifact_digest }}
          UE_BUILD_ENVIRONMENT_ARTIFACT_ID: ${{ steps.ue.outputs.ue_build_environment_artifact_id }}
          UE_BUILD_ENVIRONMENT_ARTIFACT_NAME: ${{ steps.ue.outputs.ue_build_environment_artifact_name }}
          UE_ARTIFACT_DIGEST: ${{ steps.ue.outputs.ue_artifact_digest }}
          UE_ARTIFACT_ID: ${{ steps.ue.outputs.ue_artifact_id }}
          UE_ARTIFACT_NAME: ${{ steps.ue.outputs.ue_artifact_name }}
          UE_JOB_ID: ${{ steps.ue.outputs.ue_job_id }}
          UE_RUN_ATTEMPT: ${{ steps.ue.outputs.ue_run_attempt }}
          UE_RUN_ID: ${{ steps.ue.outputs.ue_run_id }}
          UE_RUN_URL: ${{ steps.ue.outputs.ue_run_url }}
        run: |
          import datetime
          import hashlib
          import json
          import os
          import pathlib

          build_environment_path = pathlib.Path("release/metadata/build-environment.json")
          build_environment_bytes = build_environment_path.read_bytes()
          build_environment = json.loads(build_environment_bytes)

          metadata = {
              "schemaVersion": 2,
              "releaseKind": "candidate",
              "publishedAsGitHubRelease": False,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseTag": os.environ["RELEASE_TAG"],
              "releaseCommit": os.environ["RELEASE_COMMIT"],
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "sourceArchiveCreated": False,
              "license": {
                  "spdxId": "MIT",
                  "path": "LICENSE",
                  "verifiedAgainstSource": True,
              },
              "ueValidation": {
                  "workflowPath": ".github/workflows/ue-ci.yml",
                  "requiredJob": "UE 5.8 BuildPlugin and automation",
                  "requiredRunnerLabels": ["self-hosted", "windows", "gui", "ue-5.8"],
                  "runId": int(os.environ["UE_RUN_ID"]),
                  "runAttempt": int(os.environ["UE_RUN_ATTEMPT"]),
                  "runUrl": os.environ["UE_RUN_URL"],
                  "jobId": int(os.environ["UE_JOB_ID"]),
                  "artifactId": int(os.environ["UE_ARTIFACT_ID"]),
                  "artifactDigest": os.environ["UE_ARTIFACT_DIGEST"],
                  "artifactName": os.environ["UE_ARTIFACT_NAME"],
                  "artifactCommitMatched": True,
                  "buildEnvironmentArtifact": {
                      "artifactId": int(os.environ["UE_BUILD_ENVIRONMENT_ARTIFACT_ID"]),
                      "artifactName": os.environ["UE_BUILD_ENVIRONMENT_ARTIFACT_NAME"],
                      "artifactDigest": os.environ["UE_BUILD_ENVIRONMENT_ARTIFACT_DIGEST"],
                  },
                  "buildEnvironment": build_environment,
                  "buildEnvironmentSha256": (
                      "sha256:" + hashlib.sha256(build_environment_bytes).hexdigest()
                  ),
              },
              "validationClaim": (
                  "Trusted UE 5.8 BuildPlugin, repository automation, and GUI CEF browser binding/task DOM-event coverage."
              ),
          }

          output = pathlib.Path("release/metadata/provenance.json")
          output.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          persisted = json.loads(output.read_text(encoding="utf-8"))
          if persisted["ueValidation"]["buildEnvironment"] != build_environment:
              raise RuntimeError(
                  "Embedded build environment does not equal canonical build-environment.json."
              )

      - name: Create candidate archive and SHA-256
        id: archive
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          archive_name="UnrealEditorWebUI-${RELEASE_TAG}-UE58.zip"
          mkdir -p release/staging/UnrealEditorWebUI
          cp -a trusted-package/. release/staging/UnrealEditorWebUI/
          (
            cd release/staging
            zip -q -r -X "../$archive_name" UnrealEditorWebUI
          )
          (
            cd release
            sha256sum "$archive_name" > "$archive_name.sha256"
          )
          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ steps.release.outputs.release_tag }}
          path: |
            release/${{ steps.archive.outputs.archive_name }}
            release/${{ steps.archive.outputs.archive_name }}.sha256
            release/metadata/*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summarize candidate status
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.archive.outputs.archive_name }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          UE_RUN_URL: ${{ steps.ue.outputs.ue_run_url }}
        run: |
          {
            echo "## Release candidate assembled"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$RELEASE_COMMIT\`"
            echo "- Archive: \`$ARCHIVE_NAME\`"
            echo "- Trusted UE validation: $UE_RUN_URL"
            echo
            echo "This workflow created a short-lived candidate artifact only. It did not create a source archive or publish a GitHub Release. The selected UE validation includes the GUI CEF browser-to-UObject and task DOM-event round trip plus verified UBT build-environment evidence."
          } >> "$GITHUB_STEP_SUMMARY"
